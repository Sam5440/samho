<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hello Samho</title>
<style>
  :root {
    --bg: #08090c;
    --card: #111318;
    --card-top: #171a21;
    --line: #262a33;
    --text: #f2f4f8;
    --muted: #9aa3b2;
    --accent: #5ad1c8;
    --accent-soft: #7c8cff;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(124, 140, 255, 0.16), transparent 62%),
      radial-gradient(700px 460px at 50% 118%, rgba(90, 209, 200, 0.12), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(460px, 100%);
    padding: 56px 40px 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, var(--card-top), var(--card) 68%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.05) inset,
      0 24px 60px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  /* 卡片顶部的一缕高光 */
  .card::before {
    content: "";
    position: absolute;
    inset: -40% 20% auto;
    height: 220px;
    background: radial-gradient(closest-side, rgba(124, 140, 255, 0.22), transparent);
    pointer-events: none;
  }

  .ring {
    position: relative;
    width: 152px;
    height: 152px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    animation: breathe 3.8s ease-in-out infinite;
  }

  /* 环体：conic 渐变 + 圆形遮罩挖空中心，纯 CSS 画出的圆环 */
  .ring-arc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 140deg, var(--accent), var(--accent-soft), var(--accent));
    -webkit-mask: radial-gradient(circle, transparent 58%, #000 59%);
    mask: radial-gradient(circle, transparent 58%, #000 59%);
  }

  /* 向外扩散的呼吸光晕 */
  .ring::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(90, 209, 200, 0.45);
    animation: glow 3.8s ease-in-out infinite;
  }

  /* 环心的小圆点，让静止时也有焦点 */
  .ring-core {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(180deg, #eaf6ff, var(--accent));
    box-shadow: 0 0 14px rgba(90, 209, 200, 0.75);
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 7vw, 40px);
    font-weight: 650;
    letter-spacing: 0.02em;
    background: linear-gradient(94deg, #ffffff 12%, #cfe4ff 52%, var(--accent) 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    margin: 0;
    max-width: 32ch;
    font-size: 15px;
    line-height: 1.75;
    color: var(--muted);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.94); filter: brightness(0.86) saturate(0.9); }
    50%      { transform: scale(1.04); filter: brightness(1.12) saturate(1.1); }
  }

  @keyframes glow {
    0%, 100% {
      box-shadow:
        0 0 10px rgba(90, 209, 200, 0.22),
        0 0 26px rgba(124, 140, 255, 0.12);
      opacity: 0.55;
    }
    50% {
      box-shadow:
        0 0 24px rgba(90, 209, 200, 0.55),
        0 0 62px rgba(124, 140, 255, 0.34);
      opacity: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring, .ring::after { animation: none; }
    .ring::after { opacity: 0.9; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="ring" aria-hidden="true">
      <span class="ring-arc"></span>
      <span class="ring-core"></span>
    </div>
    <h1>Hello Samho</h1>
    <p>一个本地优先的命令行智能体，安静地呼吸，等你开口。</p>
  </main>
</body>
</html>
