name: 跨平台 Rust 与网页工作台验证
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# 第三方 Action 固定到完整 commit SHA（供应链可复现）；升级交给 Dependabot
# （见 .github/dependabot.yml），合并前人工核对变更。
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master（stable）
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 前端构建（React + shadcn/ui，产物须与提交一致）
        run: |
          npm ci --prefix web/app
          npm --prefix web/app run build
          git diff --exit-code -- web/dist
        shell: bash
      - name: Rust 行为及协议契约
        run: cargo test --workspace --locked
      - name: Rust 静态检查
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings
      - name: 网页工作台契约
        run: |
          node --test scripts/test-workbench-contracts.mjs
          node scripts/check-web-esm.mjs
      - name: 锁定依赖发布构建
        run: cargo build --release --locked -p samho
      - name: 跨平台真实服务冒烟
        run: python scripts/smoke_runtime.py --binary target/release/samho
      - name: 保留验证记录
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 验证-${{ matrix.os }}
          path: reports/ci-smoke.json
          if-no-files-found: ignore

  # 声明的 MSRV（Cargo.toml rust-version = 1.88）单独验证，防止 stable-only
  # CI 掩盖最低工具链破坏。
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: msrv
      - name: MSRV 编译检查
        run: cargo check --workspace --locked
      - name: MSRV 行为契约
        run: cargo test --workspace --locked

  # RustSec 公告扫描：已知漏洞 fail 该 job；忽略项需在 PR 中说明理由。
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
