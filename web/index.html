<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rπ — 智能体工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'12'%20fill%3D'%230d0d0d'%2F%3E%3Ctext%20x%3D'9'%20y%3D'45'%20fill%3D'%23ffffff'%20font-family%3D'Georgia%2Cserif'%20font-style%3D'italic'%20font-size%3D'41'%3Er%CF%80%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/base.css">
  <link rel="stylesheet" href="/ui/components.css">
  <link rel="stylesheet" href="/ui/cult.css">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body data-theme="dark">
  <div class="workbench">
    <header class="topbar">
      <a class="brand" href="/" aria-label="rπ 工作台首页"><span class="brand-mark">rπ</span><span class="brand-word">智能体工作台</span></a>
      <button id="toggle-sidebar" class="sidebar-toggle" data-component="button" data-variant="ghost" data-size="icon-sm" aria-label="会话导航" aria-controls="sidebar" aria-expanded="false" title="会话导航">☰</button>
      <div class="topbar-workspace"><span class="dot" aria-hidden="true"></span><span id="workspace-name">正在连接工作区…</span></div>
      <nav class="topbar-nav" aria-label="项目资料"><a href="/docs">中文文档</a><a href="/plan">确认计划</a></nav>
      <span class="topbar-spacer"></span>
      <div class="connection"><span id="connection-dot" class="status-dot"></span><span id="connection-label">连接中</span></div>
      <button id="toggle-dock" data-component="button" data-variant="ghost" data-size="icon-sm" aria-label="工具面板" title="工具面板" aria-pressed="false">◫</button>
      <button id="theme-toggle" data-component="button" data-variant="ghost" data-size="icon-sm" aria-label="切换主题" title="切换主题">◐</button>
      <button id="open-settings" data-component="button" data-variant="ghost" data-size="icon-sm" aria-label="界面设置" title="界面设置">⚙</button>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="会话导航"></aside>

    <main class="main-panel">
      <canvas id="gridbeam" class="gridbeam-canvas" aria-hidden="true" hidden></canvas>
      <div class="conversation-head">
        <div class="min-w-0">
          <h1 id="conversation-title" class="conversation-title">从一个任务开始</h1>
          <div id="conversation-sub" class="conversation-sub">草稿 · 发送首条消息后落库</div>
        </div>
        <div class="conversation-actions">
          <span id="task-state" class="task-state">就绪</span>
          <span id="task-progress" role="progressbar" aria-label="任务轮次进度" hidden></span>
          <button id="fork-session" data-component="button" data-variant="outline" data-size="sm" disabled>分支会话</button>
          <button id="refresh-sessions" data-component="button" data-variant="ghost" data-size="icon-sm" aria-label="刷新会话" title="刷新会话列表">↻</button>
        </div>
      </div>
      <div id="timeline" class="timeline" aria-label="任务对话"></div>
      <div id="composer-host" class="composer-host"></div>
    </main>

    <aside class="inspector" id="inspector" aria-label="设备与运行时面板">
      <div id="dock-head"></div>
      <div class="inspector-panels">
        <section id="panel-files" class="inspector-panel is-dock" role="tabpanel" aria-label="文件管理" hidden></section>
        <section id="panel-git" class="inspector-panel is-dock" role="tabpanel" aria-label="Git 审查" hidden></section>
        <section id="panel-term" class="inspector-panel is-dock" role="tabpanel" aria-label="终端" hidden></section>
        <section id="panel-browser" class="inspector-panel is-dock" role="tabpanel" aria-label="浏览器" hidden></section>
        <section id="panel-trajectory" class="inspector-panel is-scroll" role="tabpanel" aria-label="模型轨迹" hidden></section>
        <section id="panel-agents" class="inspector-panel is-scroll" role="tabpanel" aria-label="子代理" hidden></section>
        <section id="panel-tasks" class="inspector-panel is-scroll" role="tabpanel" aria-label="任务看板" hidden></section>
        <section id="panel-objects" class="inspector-panel is-scroll" role="tabpanel" aria-label="对象注册表" hidden></section>
        <section id="panel-mcp" class="inspector-panel is-scroll" role="tabpanel" aria-label="MCP 服务" hidden></section>
        <section id="panel-skills" class="inspector-panel is-scroll" role="tabpanel" aria-label="技能库" hidden></section>
        <section id="panel-models" class="inspector-panel is-scroll" role="tabpanel" aria-label="模型分配" hidden></section>
      </div>
    </aside>
  </div>
</body>
</html>
