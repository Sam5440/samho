[workspace]
resolver = "2"
members = ["crates/samho-core", "crates/samho-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "form", "native-tls"] }
futures-util = "0.3"
regex = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
portable-pty = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
